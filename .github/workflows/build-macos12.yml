name: Build DockDoor for macOS 12

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (xcode-27 matches the upstream project's CI; macos-26 uses Xcode 26.6)"
        type: choice
        default: xcode-27
        options:
          - xcode-27
          - macos-26

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6 on macos-26
        if: ${{ inputs.runner == 'macos-26' }}
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
          swift --version

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project DockDoor.xcodeproj -scheme DockDoor

      - name: Build (universal, deployment target 12.0)
        run: |
          set -o pipefail
          xcodebuild build \
            -project DockDoor.xcodeproj \
            -scheme DockDoor \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -skipMacroValidation -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64" \
            MACOSX_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=NO \
            2>&1 | tee build.log

      - name: Verify minimum macOS version
        run: |
          APP=build/Build/Products/Release/DockDoor.app
          lipo -info "$APP/Contents/MacOS/DockDoor"
          otool -l "$APP/Contents/MacOS/DockDoor" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | head -20
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"

      - name: Ad-hoc sign and zip
        run: |
          APP=build/Build/Products/Release/DockDoor.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" DockDoor-macOS12.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: DockDoor-macOS12
          path: DockDoor-macOS12.zip

      - name: Print compile errors
        if: ${{ failure() }}
        run: grep -E "error:|requires minimum platform" build.log | sort -u | head -100

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
